<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>الشروط والأحكام | PayOnen</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f4f7fc;
      font-family: Arial, sans-serif;
    }
    .container {
      max-width: 600px;
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      margin-top: 5%;
    }
    .btn-custom {
      background-color: #007bff;
      color: white;
    }
    .btn-custom:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="text-center mb-4">الشروط والأحكام</h2>
    <p>يرجى قراءة الشروط والأحكام التالية بعناية:</p>
    <ul>
      <li>يجب أن توافق على هذه الشروط لاستخدام الخدمة.</li>
      <li>يجب أن تكون طريقة الدفع صالحة.</li>
      <li>أي مشكلة في الدفع يجب أن يتم حلها مع مزود الخدمة.</li>
      <li>نحتفظ بالحق في تغيير هذه الشروط في أي وقت.</li>
    </ul>
    <div class="text-center">
      <button class="btn btn-custom" onclick="acceptTerms()">أوافق وأنتقل إلى الخدمة</button>
    </div>
  </div>

  <script>
    // عند الموافقة على الشروط
    function acceptTerms() {
      // تخزين الموافقة في localStorage
      localStorage.setItem('termsAccepted', 'true');
      // توجيه المستخدم إلى صفحة الدفع (index.html)
      window.location.href = 'fivfth_6_Etrechin.html';
    }
  </script>
</body>
</html>
